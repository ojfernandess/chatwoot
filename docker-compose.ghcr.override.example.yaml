# Cópia de referência — o arquivo usado no deploy é docker-compose.ghcr.override.yaml no repositório.
# Personalize CHATWOOT_IMAGE no .env se o default ghcr.io/ojfernandess/chatwoot:customizations não servir.

services:
  chatwoot:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    build: null

  chatwoot-sidekiq:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    build: null
