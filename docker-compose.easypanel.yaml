# EasyPanel: UM único arquivo — imagem pré-buildada no GHCR (sem build no servidor).
# Fonte → Caminho de build: /  |  Compose: docker-compose.yml (recomendado) ou este ficheiro
# NUNCA defina o caminho de build como nome deste YAML — causa buildx .../yaml/Dockerfile
#
# Limitação do painel: em projeto COMPOSE costuma existir UM editor de .env global, não “env por
# serviço” como em apps isolados. Neste arquivo:
#   • .env = variáveis compartilhadas (SECRET_KEY_BASE, FRONTEND_URL, SMTP, etc.)
#   • Arquivos OPCIONAIS ao lado do compose (crie no servidor / editor de ficheiros do painel):
#       .env.chatwoot      — só entra no container chatwoot
#       .env.sidekiq       — só no chatwoot-sidekiq
#       .env.postgres      — só no chatwoot1-db (ex.: POSTGRES_PASSWORD)
#     Se não existirem, o Compose ignora (required: false). Requer Docker Compose v2.24+.
# Rails e Sidekiq normalmente usam o MESMO .env; use .env.sidekiq só para exceções (ex. LOG_LEVEL).
#
# Pré-requisito: GitHub Actions "Build and push image (GHCR)" verde na branch customizations.
# Imagem padrão: ghcr.io/ojfernandess/chatwoot:customizations (CHATWOOT_IMAGE no .env para outra tag).
# Pacote GHCR público OU docker login ghcr.io no servidor (PAT read:packages).
#
# Para build local no clone, use docker-compose.yaml (não este arquivo).

services:
  chatwoot:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    restart: always
    env_file:
      - path: .env
        required: true
      - path: .env.chatwoot
        required: false
    volumes:
      - storage_data:/app/storage
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  chatwoot-sidekiq:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    restart: always
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    env_file:
      - path: .env
        required: true
      - path: .env.sidekiq
        required: false
    volumes:
      - storage_data:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  chatwoot1-db:
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - path: .env.postgres
        required: false
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  chatwoot-redis:
    image: redis:alpine
    restart: always
    command: redis-server
    volumes:
      - redis:/data

volumes:
  storage_data:
  postgres:
  redis:
