# EasyPanel: UM único arquivo — imagem pré-buildada no GHCR (sem build no servidor).
# Fonte → Arquivo Docker Compose: docker-compose.easypanel.yaml
#
# Pré-requisito: GitHub Actions "Build and push image (GHCR)" verde na branch customizations.
# Imagem padrão: ghcr.io/ojfernandess/chatwoot:customizations (sobrescreva com CHATWOOT_IMAGE no .env).
# Pacote GHCR público OU docker login ghcr.io no servidor (PAT read:packages).
#
# Para build local no clone, use docker-compose.yaml (não este arquivo).

services:
  chatwoot:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    restart: always
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  chatwoot-sidekiq:
    image: ${CHATWOOT_IMAGE:-ghcr.io/ojfernandess/chatwoot:customizations}
    pull_policy: always
    restart: always
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    env_file: .env
    volumes:
      - storage_data:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  chatwoot1-db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  chatwoot-redis:
    image: redis:alpine
    restart: always
    command: redis-server
    volumes:
      - redis:/data

volumes:
  storage_data:
  postgres:
  redis:
