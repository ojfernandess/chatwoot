# EasyPanel / self-hosted: build from docker/Dockerfile. Postgres image exige POSTGRES_PASSWORD não vazio.
# Nomes dos serviços alinhados ao painel EasyPanel: chatwoot, chatwoot-sidekiq, chatwoot1-db (+ chatwoot-redis).
# Sem `ports` no host: evita conflito com outros stacks; o proxy do painel fala com chatwoot:3000 na rede interna.
# Para bind manual (sem proxy), mescle docker-compose.host-ports.override.example.yaml.
# Imagem pré-buildada (GHCR): mescle docker-compose.ghcr.override.yaml — ver comentários nesse arquivo.
# Se o .env tiver POSTGRES_PASSWORD vazio, as variáveis abaixo nos serviços app sobrepõem para bater certo com o Postgres.
services:
  chatwoot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        BUNDLE_WITHOUT: development:test
        RAILS_SERVE_STATIC_FILES: "true"
        NODE_OPTIONS: "--max-old-space-size=8192 --openssl-legacy-provider"
    image: agentslabs-chatwoot:latest
    restart: always
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  chatwoot-sidekiq:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        BUNDLE_WITHOUT: development:test
        RAILS_SERVE_STATIC_FILES: "true"
        NODE_OPTIONS: "--max-old-space-size=8192 --openssl-legacy-provider"
    image: agentslabs-chatwoot:latest
    restart: always
    depends_on:
      chatwoot1-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_started
    env_file: .env
    volumes:
      - storage_data:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=chatwoot1-db
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://chatwoot-redis:6379
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  chatwoot1-db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  chatwoot-redis:
    image: redis:alpine
    restart: always
    command: redis-server
    volumes:
      - redis:/data

volumes:
  storage_data:
  postgres:
  redis:
