# EasyPanel / self-hosted: build from official Chatwoot Dockerfile (not rails.Dockerfile — that requires chatwoot:development).
# Image tag avoids docker.io/library/chatwoot (invalid pull). Both services share one build.
services:
  chatwoot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        BUNDLE_WITHOUT: development:test
        RAILS_SERVE_STATIC_FILES: "true"
    image: agentslabs-chatwoot:latest
    restart: always
    env_file: .env
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
        BUNDLE_WITHOUT: development:test
        RAILS_SERVE_STATIC_FILES: "true"
    image: agentslabs-chatwoot:latest
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    volumes:
      - storage_data:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:alpine
    restart: always
    command: redis-server
    volumes:
      - redis:/data

volumes:
  storage_data:
  postgres:
  redis:
